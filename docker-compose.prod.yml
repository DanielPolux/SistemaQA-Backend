name: sistema-qa

services:

  postgres:
    image: postgres:16-alpine
    container_name: sqa_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./SistemaQA-Backend/database/init:/docker-entrypoint-initdb.d:ro
    # Sin publicar puerto al host: solo accesible dentro de la red de docker compose.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./SistemaQA-Backend
      dockerfile: Dockerfile
    container_name: sqa_backend
    env_file: ./SistemaQA-Backend/.env
    environment:
      DB_HOST: postgres
      DB_SYNC: "false"
    volumes:
      - backend_uploads:/app/uploads
    # No se publica al host: el frontend (nginx) lo alcanza por la red interna
    # como "backend:3000". Descomenta "ports" si necesitas pegarle directo para debug.
    # ports:
    #   - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./SistemaQA
      dockerfile: Dockerfile.prod
    container_name: sqa_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:
